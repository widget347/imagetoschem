<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="mcIVASmaker Web - Convert images into Minecraft block art directly in your browser. Supports multiple color algorithms and block filtering.">
    <title>mcIVASmaker Web — Image to Minecraft Blocks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
/* ============================================
   mcIVASmaker Web — Style System
   ============================================ */

:root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: #16161f;
    --bg-card-hover: #1c1c28;
    --bg-input: #1a1a26;
    --bg-input-focus: #1e1e2c;

    --border-subtle: rgba(255, 255, 255, 0.06);
    --border-medium: rgba(255, 255, 255, 0.1);
    --border-accent: rgba(99, 102, 241, 0.4);

    --text-primary: #e8e8f0;
    --text-secondary: #9a9ab0;
    --text-muted: #5e5e78;
    --text-accent: #818cf8;

    --accent: #6366f1;
    --accent-hover: #7c7ff7;
    --accent-glow: rgba(99, 102, 241, 0.25);

    --green: #4ade80;
    --green-glow: rgba(74, 222, 128, 0.2);

    --pink: #f472b6;
    --amber: #fbbf24;
    --red: #f87171;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 18px;

    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
    --shadow-glow: 0 0 30px var(--accent-glow);

    --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
    --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
    --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* Reset */
*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    font-size: 14px;
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.18);
}

/* ============================================
   Layout
   ============================================ */

.app-wrapper {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* Main Content */
.main-content {
    display: grid;
    grid-template-columns: 360px 1fr;
    flex: 1;
    min-height: 0;
    height: 100vh;
}

/* Panels */
.panel {
    border-right: 1px solid var(--border-subtle);
}

.panel-settings {
    overflow-y: auto;
    max-height: 100vh;
    background: var(--bg-secondary);
}

.panel-preview {
    border-right: none;
    display: flex;
    flex-direction: column;
    background: var(--bg-primary);
    overflow: hidden;
}

.panel-inner {
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0;
    height: 100%;
}

.panel-preview .panel-inner {
    gap: 0;
}

/* Sections */
.section {
    padding: 1rem 0;
    border-bottom: 1px solid var(--border-subtle);
}

.section:last-child {
    border-bottom: none;
}

.section-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.85rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.section-icon {
    font-size: 1rem;
}

/* ============================================
   Upload Zone
   ============================================ */

.upload-zone {
    border: 2px dashed var(--border-medium);
    border-radius: var(--radius-lg);
    padding: 2rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: all var(--transition-normal);
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.03) 0%, rgba(244, 114, 182, 0.03) 100%);
}

.upload-zone:hover,
.upload-zone.drag-over {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.08) 0%, rgba(244, 114, 182, 0.06) 100%);
    box-shadow: var(--shadow-glow);
    transform: translateY(-1px);
}

.upload-content {
    pointer-events: none;
}

.upload-icon-wrapper {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(99, 102, 241, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 0.85rem;
    color: var(--accent);
}

.upload-text {
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin-bottom: 0.3rem;
}

.upload-link {
    color: var(--accent);
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 2px;
}

.upload-hint {
    color: var(--text-muted);
    font-size: 0.75rem;
}

/* Image Info */
.image-info {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.75rem;
}

.info-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.78rem;
    padding: 0.3rem 0.65rem;
    border-radius: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
}

.info-label {
    color: var(--text-muted);
    font-weight: 500;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

/* ============================================
   Controls
   ============================================ */

.control-group {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    margin-bottom: 0.85rem;
}

.control-label {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 0.4rem;
}

.tooltip-trigger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(99, 102, 241, 0.15);
    color: var(--accent);
    font-size: 0.6rem;
    font-weight: 700;
    cursor: help;
    position: relative;
}

.tooltip-trigger:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    left: 120%;
    top: 50%;
    transform: translateY(-50%);
    background: #2a2a3a;
    color: var(--text-primary);
    font-size: 0.72rem;
    font-weight: 400;
    padding: 0.5rem 0.75rem;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    max-width: 280px;
    white-space: normal;
    z-index: 100;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border-medium);
}

.select-input,
.text-input {
    width: 100%;
    padding: 0.55rem 0.75rem;
    font-size: 0.82rem;
    font-family: inherit;
    background: var(--bg-input);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    outline: none;
    transition: all var(--transition-fast);
    appearance: none;
    -webkit-appearance: none;
}

.select-input {
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='7' viewBox='0 0 12 7' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L11 1' stroke='%239a9ab0' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 30px;
    cursor: pointer;
}

.select-input:focus,
.text-input:focus {
    border-color: var(--accent);
    background: var(--bg-input-focus);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
}

.select-input option {
    background: var(--bg-card);
    color: var(--text-primary);
}

.output-info {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 0.75rem;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    font-size: 0.82rem;
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
}

/* ============================================
   Block List
   ============================================ */

.btn-small {
    padding: 0.2rem 0.55rem;
    font-size: 0.68rem;
    font-family: inherit;
    font-weight: 500;
    background: var(--bg-card);
    border: 1px solid var(--border-medium);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition-fast);
    margin-left: auto;
}

.btn-small+.btn-small {
    margin-left: 0.3rem;
}

.btn-small:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent);
    color: var(--text-accent);
}

.block-search-wrapper {
    margin-bottom: 0.6rem;
}

.block-list-container {
    max-height: 240px;
    overflow-y: auto;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    background: var(--bg-input);
    padding: 0.3rem;
}

.block-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.35rem 0.55rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background var(--transition-fast);
    user-select: none;
    font-size: 0.78rem;
    color: var(--text-secondary);
}

.block-item:hover {
    background: var(--bg-card-hover);
}

.block-item.selected {
    background: rgba(74, 222, 128, 0.08);
    color: var(--green);
}

.block-item .block-checkbox {
    width: 14px;
    height: 14px;
    border: 1.5px solid var(--border-medium);
    border-radius: 3px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition-fast);
}

.block-item.selected .block-checkbox {
    background: var(--green);
    border-color: var(--green);
}

.block-item.selected .block-checkbox::after {
    content: '✓';
    font-size: 0.6rem;
    color: #0a0a0f;
    font-weight: 700;
}

.block-item .block-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
}

.block-count {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 0.5rem;
    font-family: 'JetBrains Mono', monospace;
}

/* ============================================
   Buttons
   ============================================ */

.btn-primary {
    width: 100%;
    padding: 0.85rem 1.5rem;
    font-size: 0.92rem;
    font-weight: 600;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
    border: none;
    border-radius: var(--radius-md);
    color: white;
    cursor: pointer;
    transition: all var(--transition-normal);
    box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
    position: relative;
    overflow: hidden;
}

.btn-primary::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.1) 100%);
    opacity: 0;
    transition: opacity var(--transition-fast);
}

.btn-primary:hover::before {
    opacity: 1;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 30px rgba(99, 102, 241, 0.4);
}

.btn-primary:active {
    transform: translateY(0);
}

.btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

.btn-download {
    padding: 0.6rem 1.2rem;
    font-size: 0.85rem;
    font-weight: 600;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: linear-gradient(135deg, #059669 0%, #10b981 100%);
    border: none;
    border-radius: var(--radius-md);
    color: white;
    cursor: pointer;
    transition: all var(--transition-normal);
    box-shadow: 0 4px 16px rgba(16, 185, 129, 0.25);
}

.btn-download:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(16, 185, 129, 0.35);
}

.btn-download-secondary {
    background: linear-gradient(135deg, #374151 0%, #4b5563 100%);
    box-shadow: 0 4px 16px rgba(75, 85, 99, 0.25);
}

.btn-download-secondary:hover {
    box-shadow: 0 6px 24px rgba(75, 85, 99, 0.35);
}

/* ============================================
   Preview Tabs & Area
   ============================================ */

.preview-tabs {
    display: flex;
    gap: 0.3rem;
    padding: 0 0 1rem;
    border-bottom: 1px solid var(--border-subtle);
}

.tab {
    padding: 0.55rem 1.2rem;
    font-size: 0.82rem;
    font-weight: 500;
    font-family: inherit;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-md);
    color: var(--text-muted);
    cursor: pointer;
    transition: all var(--transition-fast);
}

.tab:hover {
    color: var(--text-secondary);
    background: var(--bg-card);
}

.tab.active {
    background: var(--bg-card);
    border-color: var(--border-medium);
    color: var(--text-primary);
}

.preview-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 1rem;
    min-height: 400px;
}

.preview-area canvas {
    max-width: 100%;
    max-height: calc(100vh - 160px);
    border-radius: var(--radius-md);
    image-rendering: pixelated;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border-subtle);
}

/* Empty State */
.empty-state {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
}

.empty-blocks {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    width: 64px;
    height: 64px;
    margin: 0 auto 1.2rem;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

.empty-block {
    border-radius: 4px;
    opacity: 0.4;
}

.empty-block.b1 {
    background: var(--green);
    animation: pulse 2s ease-in-out infinite 0s;
}

.empty-block.b2 {
    background: #60a5fa;
    animation: pulse 2s ease-in-out infinite 0.3s;
}

.empty-block.b3 {
    background: var(--pink);
    animation: pulse 2s ease-in-out infinite 0.6s;
}

.empty-block.b4 {
    background: var(--amber);
    animation: pulse 2s ease-in-out infinite 0.9s;
}

@keyframes pulse {

    0%,
    100% {
        opacity: 0.3;
    }

    50% {
        opacity: 0.7;
    }
}

/* ============================================
   Progress
   ============================================ */

.progress-wrapper {
    padding: 0.75rem 0;
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.progress-bar {
    flex: 1;
    height: 6px;
    background: var(--bg-card);
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent) 0%, #a78bfa 100%);
    border-radius: 10px;
    transition: width 100ms linear;
    box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
}

.progress-text {
    font-size: 0.78rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-secondary);
    min-width: 40px;
    text-align: right;
}

/* ============================================
   Download Bar
   ============================================ */

.download-bar {
    padding: 0.75rem 0;
    display: flex;
    align-items: center;
    gap: 1rem;
    border-top: 1px solid var(--border-subtle);
}

.download-info {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
}

/* ============================================
   Loading Overlay
   ============================================ */

.loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 15, 0.92);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity var(--transition-slow);
}

.loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
}

.loading-content {
    text-align: center;
}

.loader-spinner {
    width: 44px;
    height: 44px;
    border: 3px solid var(--border-medium);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 1.2rem;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.loading-text {
    font-size: 1rem;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 0.3rem;
}

.loading-subtext {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
}

/* ============================================
   Responsive
   ============================================ */

@media (max-width: 900px) {
    .main-content {
        grid-template-columns: 1fr;
        height: auto;
    }

    .panel-settings {
        max-height: none;
        border-right: none;
        border-bottom: 1px solid var(--border-subtle);
    }

    .preview-area {
        min-height: 300px;
    }
}
</style>
</head>

<body>
    <div class="app-wrapper">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Panel: Upload & Settings -->
            <aside class="panel panel-settings">
                <div class="panel-inner">
                    <!-- Upload Section -->
                    <section class="section" id="upload-section">
                        <h2 class="section-title">
                            <span class="section-icon">📁</span>
                            Load Image
                        </h2>
                        <div class="upload-zone" id="upload-zone">
                            <input type="file" id="file-input" accept="image/png,image/jpeg,image/bmp,image/webp"
                                hidden>
                            <div class="upload-content">
                                <div class="upload-icon-wrapper">
                                    <svg class="upload-icon" width="40" height="40" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="1.5">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                        <polyline points="17 8 12 3 7 8" />
                                        <line x1="12" y1="3" x2="12" y2="15" />
                                    </svg>
                                </div>
                                <p class="upload-text">Drop image here or <span class="upload-link">browse</span></p>
                                <p class="upload-hint">PNG, JPG, BMP, WebP</p>
                            </div>
                        </div>
                        <div class="image-info" id="image-info" style="display: none;">
                            <div class="info-chip"><span class="info-label">File:</span> <span
                                    id="info-filename">—</span></div>
                            <div class="info-chip"><span class="info-label">Size:</span> <span id="info-size">—</span>
                            </div>
                        </div>
                    </section>

                    <!-- Settings Section -->
                    <section class="section" id="settings-section" style="display: none;">
                        <h2 class="section-title">
                            <span class="section-icon">⚙️</span>
                            Settings
                        </h2>

                        <!-- Resolution -->
                        <div class="control-group">
                            <label class="control-label" for="resolution-width">Custom Resolution (blocks)</label>
                            <div style="display: flex; gap: 8px;">
                                <input id="resolution-width" class="text-input" type="number" min="1" step="1" value="128"
                                    placeholder="Width">
                                <input id="resolution-height" class="text-input" type="number" min="1" step="1" value="128"
                                    placeholder="Height">
                                <button id="btn-resolution-sync" class="btn-small" type="button">Sync: On</button>
                            </div>
                        </div>

                        <!-- Block Side -->
                        <div class="control-group">
                            <label class="control-label" for="side-select">Block Side</label>
                            <select id="side-select" class="select-input">
                                <option value="top">Top</option>
                                <option value="bottom">Bottom</option>
                                <option value="front">Front</option>
                                <option value="back">Back</option>
                                <option value="side" selected>Side</option>
                            </select>
                        </div>

                        <!-- Filter Mode -->
                        <div class="control-group">
                            <label class="control-label" for="filter-mode">Block Filter</label>
                            <select id="filter-mode" class="select-input">
                                <option value="None">None</option>
                                <option value="Whitelist">Whitelist</option>
                                <option value="Blacklist" selected>Blacklist</option>
                            </select>
                        </div>

                        <!-- Color Average Set -->
                        <div class="control-group">
                            <label class="control-label" for="color-set">
                                Color Average
                                <span class="tooltip-trigger"
                                    data-tooltip="Pre-computed color averages of each Minecraft block, calculated in different ways">?</span>
                            </label>
                            <select id="color-set" class="select-input">
                                <option value="Linear Average" selected>Linear Average</option>
                                <option value="Root Mean Square Average">Root Mean Square</option>
                                <option value="HSL Average">HSL Average</option>
                                <option value="HSV Average">HSV Average</option>
                                <option value="LAB Average">LAB Average</option>
                                <option value="Dominant Color">Dominant Color</option>
                            </select>
                        </div>

                        <!-- Color Comparison Algorithm -->
                        <div class="control-group">
                            <label class="control-label" for="color-compare">
                                Color Comparison

<script>
/* ============================================
   NBT Writer + Schematic Builder
   For generating Minecraft .schem files in-browser
   ============================================ */

// NBT Tag Type IDs
const TAG_END = 0;
const TAG_BYTE = 1;
const TAG_SHORT = 2;
const TAG_INT = 3;
const TAG_LONG = 4;
const TAG_FLOAT = 5;
const TAG_DOUBLE = 6;
const TAG_BYTE_ARRAY = 7;
const TAG_STRING = 8;
const TAG_LIST = 9;
const TAG_COMPOUND = 10;
const TAG_INT_ARRAY = 11;

class NBTWriter {
    constructor() {
        this.bytes = [];
    }

    writeByte(v) {
        this.bytes.push(v & 0xFF);
    }

    writeShort(v) {
        this.bytes.push((v >> 8) & 0xFF, v & 0xFF);
    }

    writeInt(v) {
        this.bytes.push((v >> 24) & 0xFF, (v >> 16) & 0xFF, (v >> 8) & 0xFF, v & 0xFF);
    }

    writeLong(hi, lo) {
        this.writeInt(hi);
        this.writeInt(lo);
    }

    writeString(s) {
        const encoder = new TextEncoder();
        const encoded = encoder.encode(s);
        this.writeShort(encoded.length);
        for (const b of encoded) this.bytes.push(b);
    }

    writeTagHeader(type, name) {
        this.writeByte(type);
        this.writeString(name);
    }

    writeTagByte(name, val) {
        this.writeTagHeader(TAG_BYTE, name);
        this.writeByte(val);
    }

    writeTagShort(name, val) {
        this.writeTagHeader(TAG_SHORT, name);
        this.writeShort(val);
    }

    writeTagInt(name, val) {
        this.writeTagHeader(TAG_INT, name);
        this.writeInt(val);
    }

    writeTagString(name, val) {
        this.writeTagHeader(TAG_STRING, name);
        this.writeString(val);
    }

    writeTagIntArray(name, arr) {
        this.writeTagHeader(TAG_INT_ARRAY, name);
        this.writeInt(arr.length);
        for (const v of arr) this.writeInt(v);
    }

    writeTagByteArray(name, arr) {
        this.writeTagHeader(TAG_BYTE_ARRAY, name);
        this.writeInt(arr.length);
        for (const v of arr) this.writeByte(v);
    }

    writeCompoundStart(name) {
        this.writeTagHeader(TAG_COMPOUND, name);
    }

    writeCompoundEnd() {
        this.writeByte(TAG_END);
    }

    toUint8Array() {
        return new Uint8Array(this.bytes);
    }
}

// Varint encoder (used for block data in .schem)
function encodeVarint(value) {
    const result = [];
    while (true) {
        if ((value & ~0x7F) === 0) {
            result.push(value & 0xFF);
            break;
        }
        result.push(((value & 0x7F) | 0x80) & 0xFF);
        value >>>= 7;
    }
    return result;
}

// Block name parser (ported from block_parser.py)
function blockParser(block) {
    const specialBlocks = {
        "bee_nest_honey": "bee_nest[honey_level=5]",
        "beehive_honey": "beehive[honey_level=5]",
        "blast_furnace_on": "blast_furnace[lit=true]",
        "chorus_flower_dead": "chorus_flower[age=5]",
        "daylight_detector_inverted": "daylight_detector[inverted=true]",
        "dispenser": "dispenser[facing=up]",
        "dropper_vertical": "dropper[facing=up]",
        "farmland_moist": "farmland[moisture=7]",
        "furnace_on": "furnace[lit=true]",
        "jigsaw_lock": "jigsaw[orientation=up_north]",
        "lava_still": "lava",
        "mushroom_block_inside": "mushroom_stem[up=false,down=false,east=false,west=false,north=false,south=false]",
        "piston_sticky": "sticky_piston",
        "redstone_lamp_on": "redstone_lamp[lit=true]",
        "respawn_anchor_lit": "respawn_anchor[charges=4]",
        "sculk_shrieker_enabled": "sculk_shrieker[can_summon=true]",
        "smoker_on": "smoker[lit=true]",
        "structure_block_load": "structure_block[mode=load]",
        "structure_block_data": "structure_block[mode=data]",
        "structure_block_corner": "structure_block[mode=corner]",
        "structure_block_save": "structure_block[mode=save]",
        "magma": "magma_block",
        "dried_kelp": "dried_kelp_block",
    };
    const output = specialBlocks[block] || block;
    return "minecraft:" + output;
}

// GZip compress using browser CompressionStream API
async function gzipCompress(data) {
    const cs = new CompressionStream("gzip");
    const writer = cs.writable.getWriter();
    writer.write(data);
    writer.close();
    const reader = cs.readable.getReader();
    const chunks = [];
    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
    }
    let totalLen = 0;
    for (const c of chunks) totalLen += c.length;
    const result = new Uint8Array(totalLen);
    let offset = 0;
    for (const c of chunks) {
        result.set(c, offset);
        offset += c.length;
    }
    return result;
}

// Build a .schem file from block placement data
// blocks: array of { x, y, z, blockId } where blockId is like "minecraft:stone"
// Follows Sponge Schematic Specification v3
async function buildSchematic(blocks, width, height, length) {
    // Build palette
    const palette = {};
    let paletteIndex = 0;
    // Air is always index 0
    palette["minecraft:air"] = paletteIndex++;

    for (const b of blocks) {
        if (!(b.blockId in palette)) {
            palette[b.blockId] = paletteIndex++;
        }
    }

    // Build block data array (varint encoded)
    // Index formula: x + z * Width + y * Width * Length
    // Initialize all to air (index 0)
    const totalBlocks = width * height * length;
    const blockIndices = new Array(totalBlocks).fill(0);

    for (const b of blocks) {
        // Adjust coordinates to be positive (schematic coords are 0-based)
        const idx = b.x + b.z * width + b.y * width * length;
        if (idx >= 0 && idx < totalBlocks) {
            blockIndices[idx] = palette[b.blockId];
        }
    }

    // Varint encode
    const varintData = [];
    for (const index of blockIndices) {
        const encoded = encodeVarint(index);
        for (const b of encoded) varintData.push(b);
    }

    // Write NBT
    const nbt = new NBTWriter();

    // Root compound (unnamed)
    nbt.writeCompoundStart("");

    // Schematic compound
    nbt.writeCompoundStart("Schematic");
    nbt.writeTagInt("Version", 3);
    nbt.writeTagInt("DataVersion", 3700); // MC 1.20.4
    nbt.writeTagShort("Width", width);
    nbt.writeTagShort("Height", height);
    nbt.writeTagShort("Length", length);
    nbt.writeTagIntArray("Offset", [0, 0, 0]);

    // Blocks compound
    nbt.writeCompoundStart("Blocks");

    // Palette compound
    nbt.writeCompoundStart("Palette");
    for (const [blockState, idx] of Object.entries(palette)) {
        nbt.writeTagInt(blockState, idx);
    }
    nbt.writeCompoundEnd(); // end Palette

    // Data (byte array of varints)
    nbt.writeTagByteArray("Data", varintData);

    nbt.writeCompoundEnd(); // end Blocks
    nbt.writeCompoundEnd(); // end Schematic
    nbt.writeCompoundEnd(); // end root

    // GZip compress
    const rawNBT = nbt.toUint8Array();
    const compressed = await gzipCompress(rawNBT);
    return compressed;
}

// Export for use in app.js
window.SchemBuilder = {
    blockParser,
    buildSchematic,
};

    // ---- Color Comparison Functions (ported from Python) ---------------------

    function absValueDifference(x, y) {
        let d = 0;
        for (let i = 0; i < 4; i++) d += Math.abs(x[i] - y[i]);
        return d;
    }

    function euclideanDifference(x, y) {
        let d = 0;
        for (let i = 0; i < 4; i++) d += (x[i] - y[i]) ** 2;
        return d;
    }

    function weightedEuclidean(x, y) {
        const dr = x[0] - y[0], dg = x[1] - y[1], db = x[2] - y[2], da = x[3] - y[3];
        const rBar = (x[0] + y[0]) / 2.0;
        if (rBar < 128) {
            return 2 * dr * dr + 4 * dg * dg + 3 * db * db + da * da;
        } else {
            return 3 * dr * dr + 4 * dg * dg + 2 * db * db + da * da;
        }
    }

    function redmeanDifference(x, y) {
        const dr = x[0] - y[0], dg = x[1] - y[1], db = x[2] - y[2], da = x[3] - y[3];
        const rBar = (x[0] + y[0]) / 2.0;
        return (2 + rBar / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rBar) / 256) * db * db + da * da;
    }

    function rgb2lab(rgb) {
        let R = rgb[0] / 255, G = rgb[1] / 255, B = rgb[2] / 255;
        R = R > 0.04045 ? ((R + 0.055) / 1.055) ** 2.4 : R / 12.92;
        G = G > 0.04045 ? ((G + 0.055) / 1.055) ** 2.4 : G / 12.92;
        B = B > 0.04045 ? ((B + 0.055) / 1.055) ** 2.4 : B / 12.92;
        R *= 100; G *= 100; B *= 100;

        let X = R * 0.4124 + G * 0.3576 + B * 0.1805;
        let Y = R * 0.2126 + G * 0.7152 + B * 0.0722;
        let Z = R * 0.0193 + G * 0.1192 + B * 0.9505;

        X /= 95.047; Y /= 100.0; Z /= 108.883;

        X = X > 0.008856 ? X ** (1 / 3) : 7.787 * X + 16 / 116;
        Y = Y > 0.008856 ? Y ** (1 / 3) : 7.787 * Y + 16 / 116;
        Z = Z > 0.008856 ? Z ** (1 / 3) : 7.787 * Z + 16 / 116;

        return [116 * Y - 16, 500 * (X - Y), 200 * (Y - Z)];
    }

    function cie76Difference(x, y) {
        const lab1 = rgb2lab([x[0], x[1], x[2]]);
        const lab2 = rgb2lab([y[0], y[1], y[2]]);
        let d = 0;
        for (let i = 0; i < 3; i++) d += (lab1[i] - lab2[i]) ** 2;
        return d + (x[3] - y[3]) ** 2;
    }

            default: return absValueDifference;

        if (!isResolutionSyncEnabled || isSyncingResolution) return;

    // ---- Conversion Logic ----------------------------------------------------

    async function convertImage() {
        if (!loadedImage || !blocksColorData || isProcessing) return;
        isProcessing = true;

        elProgressWrapper.style.display = "flex";

        const side = elSideSelect.value;

        // Prepare scaled-down image

        const tempCanvas = document.createElement("canvas");

        const tempCtx = tempCanvas.getContext("2d");

        // Filter blocks

        if (filterMode === "Blacklist") {
            blockList = blockList.filter(([name]) => !selectedBlocks.has(name));
        } else if (filterMode === "Whitelist") {
            blockList = blockList.filter(([name]) => selectedBlocks.has(name));

        // Filter blocks that have the requested side
        blockList = blockList.filter(([, sides]) => side in sides);

        if (blockList.length === 0) {
            alert("No blocks available with the current filter settings. Adjust your blacklist/whitelist.");
            isProcessing = false;
            elBtnRun.disabled = false;
            elProgressWrapper.style.display = "none";

        // Prepare output canvas

        elCanvasOutput.width = outW;
        elCanvasOutput.height = outH;
        const outCtx = elCanvasOutput.getContext("2d");

        // Precompute: for each block in the filtered list, grab the color for this side+colorSet
        const blockColors = blockList.map(([name, sides]) => ({
            name,
            color: sides[side].color[colorSet],
            textureKey: name + side,
        }));

        // Cache for pixel -> best block index (key: r,g,b,a string)
        const cache = new Map();

        // Track block placements for .schem export
        const schemBlocks = [];

        // Process row by row with requestAnimationFrame for progress
        const totalColumns = sw;
        let col = 0;

        function processColumn() {
            const startTime = performance.now();
            // Process multiple columns per frame for speed
            while (col < totalColumns && (performance.now() - startTime) < 12) {
                for (let y = 0; y < sh; y++) {
                    const idx = (y * sw + col) * 4;
                    const r = srcData.data[idx];
                    const g = srcData.data[idx + 1];
                    const b = srcData.data[idx + 2];
                    const a = srcData.data[idx + 3];

                    if (a <= 10) continue; // transparent

                    const pixel = [r, g, b, a];
                    const key = `${r},${g},${b},${a}`;

                    let bestIdx;
                    if (cache.has(key)) {
                        bestIdx = cache.get(key);
                    } else {
                        let bestDiff = Infinity;
                        bestIdx = 0;
                        for (let i = 0; i < blockColors.length; i++) {
                            const diff = compareFn(pixel, blockColors[i].color);
                            if (diff < bestDiff) {
                                bestDiff = diff;
                                bestIdx = i;
                            }
                        }
                        cache.set(key, bestIdx);
                    }

                    const best = blockColors[bestIdx];

                    // Draw the block texture
                    const texData = blockTextures[best.textureKey];
                    if (texData) {
                        outCtx.putImageData(texData, col * 16, y * 16);
                    }

                    // Record block placement for .schem
                    schemBlocks.push({ x: col, y: y, blockName: best.name });
                }
                col++;
            }

            // Update progress
            const pct = Math.round((col / totalColumns) * 100);
            elProgressFill.style.width = pct + "%";
            elProgressText.textContent = pct + "%";

            if (col < totalColumns) {
                requestAnimationFrame(processColumn);
            } else {
                // Done!
                elProgressFill.style.width = "100%";
                elProgressText.textContent = "Done!";
                elCanvasOutput.style.display = "block";
                elEmptyOutput.style.display = "none";
                elDownloadBar.style.display = "flex";
                elDownloadInfo.textContent = `${sw} × ${sh} blocks`;
                isProcessing = false;
                elBtnRun.disabled = false;

                // Store for .schem export
                lastSchemData = { blocks: schemBlocks, sw, sh, side };

                setTimeout(() => {
                    elProgressWrapper.style.display = "none";
                }, 1500);
            }
        }

        requestAnimationFrame(processColumn);
    }

    // ---- Tab Switching -------------------------------------------------------

    function switchTab(tab) {
        if (tab === "input") {
            elTabInput.classList.add("active");
            elTabOutput.classList.remove("active");
            elPreviewInput.style.display = "flex";
            elPreviewOutput.style.display = "none";
        } else {
            elTabOutput.classList.add("active");
            elTabInput.classList.remove("active");
            elPreviewOutput.style.display = "flex";
            elPreviewInput.style.display = "none";
        }
    }

    // ---- Download ------------------------------------------------------------

    function downloadPng() {
        const link = document.createElement("a");
        link.download = "mcIVASmaker_output.png";
        link.href = elCanvasOutput.toDataURL("image/png");
        link.click();
    }

    async function downloadSchem() {
        if (!lastSchemData || !window.SchemBuilder) {
            alert("No conversion data available. Run the conversion first.");
            return;
        }

        const { blocks, sw, sh, side } = lastSchemData;
        const blockParser = window.SchemBuilder.blockParser;

        // Convert pixel grid positions to schematic block positions
        // Mirrors the Python logic from img_to_blocks_schem
        const schemBlockList = [];
        for (const b of blocks) {
            const blockId = blockParser(b.blockName);
            if (side === "top" || side === "bottom") {
                // Top/bottom view: x -> -x, z -> -y, y = 0
                schemBlockList.push({ x: sw - 1 - b.x, y: 0, z: sh - 1 - b.y, blockId });
            } else {
                // Front/side/back view: x -> -x, y -> -y, z = 0
                schemBlockList.push({ x: sw - 1 - b.x, y: sh - 1 - b.y, z: 0, blockId });
            }
        }

        // Dimensions
        let width, height, length;
        if (side === "top" || side === "bottom") {
            width = sw; height = 1; length = sh;
        } else {
            width = sw; height = sh; length = 1;
        }

        try {
            elBtnDownloadSchem.textContent = "Building .schem...";
            elBtnDownloadSchem.disabled = true;

            const schemData = await window.SchemBuilder.buildSchematic(schemBlockList, width, height, length);

            const blob = new Blob([schemData], { type: "application/octet-stream" });
            const link = document.createElement("a");
            link.download = "mcIVASmaker_output.schem";
            link.href = URL.createObjectURL(blob);
            link.click();
            URL.revokeObjectURL(link.href);
        } catch (err) {
            console.error("Failed to build .schem:", err);
            alert("Failed to build .schem file: " + err.message);
        } finally {
            elBtnDownloadSchem.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download .schem`;
            elBtnDownloadSchem.disabled = false;
        }
    }

    // ---- Event Listeners -----------------------------------------------------

    function init() {
        // Upload zone
        elUploadZone.addEventListener("click", () => elFileInput.click());
        elFileInput.addEventListener("change", (e) => {
            if (e.target.files.length > 0) handleImageLoad(e.target.files[0]);
        });

        // Drag & drop
        elUploadZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            elUploadZone.classList.add("drag-over");
        });
        elUploadZone.addEventListener("dragleave", () => {
            elUploadZone.classList.remove("drag-over");
        });
        elUploadZone.addEventListener("drop", (e) => {
            e.preventDefault();
            elUploadZone.classList.remove("drag-over");
            if (e.dataTransfer.files.length > 0) handleImageLoad(e.dataTransfer.files[0]);
        });

        // Settings changes
        elResolutionWidth.addEventListener("input", () => {
            syncResolutionFrom("width");
            updateOutputInfo();
        });
        elResolutionHeight.addEventListener("input", () => {
            syncResolutionFrom("height");
            updateOutputInfo();
        });
        elSideSelect.addEventListener("change", updateOutputInfo);
        elBtnResolutionSync.addEventListener("click", () => {
            isResolutionSyncEnabled = !isResolutionSyncEnabled;
            updateResolutionSyncButton();
            if (isResolutionSyncEnabled) {
                syncResolutionFrom("width");
                updateOutputInfo();
            }
        });

        // Block search
        elBlockSearch.addEventListener("input", (e) => filterBlockList(e.target.value));

        // Select/deselect all
        elBtnSelectAll.addEventListener("click", () => {
            blockNames.forEach(n => selectedBlocks.add(n));
            elBlockListContainer.querySelectorAll(".block-item").forEach(el => el.classList.add("selected"));
            updateBlockCount();
        });
        elBtnDeselectAll.addEventListener("click", () => {
            selectedBlocks.clear();
            elBlockListContainer.querySelectorAll(".block-item").forEach(el => el.classList.remove("selected"));
            updateBlockCount();
        });

        // Tabs
        elTabInput.addEventListener("click", () => switchTab("input"));
        elTabOutput.addEventListener("click", () => switchTab("output"));

        // Run
        elBtnRun.addEventListener("click", convertImage);

        // Download
        elBtnDownloadSchem.addEventListener("click", downloadSchem);
        elBtnDownloadPng.addEventListener("click", downloadPng);

        // Build block list and load data
        updateResolutionSyncButton();
        loadAllData().then(() => {
            buildBlockList();
        }).catch(err => {
            console.error("Failed to load block data:", err);
            elLoadingSubtext.textContent = "Error loading data. Make sure you're running from a web server.";
        });
    }

    // ---- Start ---------------------------------------------------------------
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();
</script>
</body>
